<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de @media</title>
    <!-- Estilos da pagina -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;

        }

        .box {
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: black;
        }

        .container-position {
            margin-top: 10px;
            width: 100%;
            height: 600px;
            border: 2px solid blueviolet;
            position: relative;
        }

        .filho-tamanho {
            width: 150px;
            height: 150px;
            background-color: violet;
            position: absolute;
        }

        .container-position__filho01 {
            top: 0;
            left: 0;

        }

        .container-position__filho02 {
            top: 0;
            right: 0;
        }
        
        .container-position__filho03 {
            bottom: 0;
            left: 0;
        }

        .container-position__filho04 {
            bottom: 0;
            right: 0;
        }

        .whats {
            width: 100px;
            height: 100px;
            border-radius: 50px;
            background-color: greenyellow;
            border: 2px solid #fff;
            box-shadow: 1px 2px 2px #fff;
            position: fixed;
            right: 60px;
            bottom: 45px;
        }
        .whats img{
            width: 100px;
            height: 100px;
        }

        /* Base style for mobile devices */
        body {
            padding: 20px;
            background-color: olive;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            height: 300vh;
        }

        /* For devices with a minimum width of 768px (Medium) */
        @media(min-width: 855px) {
            body {
                background-color: blue;
                color: white;
            }
        }

        /* For devices with a minimum width of 992px (Large) */
        @media(min-width: 1270px) {
            body {
                background-color: tan;
                color: black;
            }
        }
    </style>
</head>

<body>
    <h1>Teste de @media</h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position">
        <div class="container-position__filho01 filho-tamanho"></div>
        <div class="container-position__filho02 filho-tamanho"></div>
        <div class="container-position__filho03 filho-tamanho"></div>
        <div class="container-position__filho04 filho-tamanho"></div>
    </div>
    <div class="whats">
        <img src="./img/whatsapp.png" alt="">
    </div>
</body>

</html>
